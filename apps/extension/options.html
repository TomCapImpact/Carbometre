<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Carbomètre</title>
  <link rel="stylesheet" href="ui.css">
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      padding: 32px 24px 64px;
      font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f7f7f5;
      color: #111111;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #1e1e1e; color: #f5f5f5; }
    }
    main { max-width: 880px; margin: 0 auto; }
    h1 { font-size: 24px; margin: 0 0 8px; }
    .intro { margin: 0 0 28px; color: #595959; }
    @media (prefers-color-scheme: dark) { .intro, .note { color: #c7c7c7; } }
    fieldset {
      border: 1px solid rgba(0, 0, 0, 0.15);
      border-radius: 10px;
      padding: 16px 20px;
      margin: 0 0 20px;
    }
    @media (prefers-color-scheme: dark) { fieldset { border-color: rgba(255, 255, 255, 0.18); } }
    legend { font-weight: 600; padding: 0 6px; }
    .note { margin: 8px 0 0; font-size: 13px; color: #595959; }
    label.choice { display: block; margin: 6px 0; cursor: pointer; }
    label.choice input { margin-right: 8px; }
    .table-wrap { overflow-x: auto; margin-top: 8px; }
    table { border-collapse: collapse; width: 100%; font-size: 13px; }
    th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid rgba(0, 0, 0, 0.1); vertical-align: middle; }
    @media (prefers-color-scheme: dark) { th, td { border-color: rgba(255, 255, 255, 0.12); } }
    thead th { font-weight: 600; font-size: 12px; }
    tbody th { font-weight: 500; white-space: nowrap; }
    td input {
      width: 110px;
      font: inherit;
      padding: 4px 6px;
      border-radius: 6px;
      border: 1px solid rgba(0, 0, 0, 0.25);
      background: transparent;
      color: inherit;
    }
    @media (prefers-color-scheme: dark) { td input { border-color: rgba(255, 255, 255, 0.3); } }
    td input[aria-invalid="true"] { border-color: #b3261e; outline: 2px solid #b3261e; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
    button {
      font: inherit;
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid rgba(0, 0, 0, 0.3);
      background: #ffffff;
      color: inherit;
      cursor: pointer;
    }
    @media (prefers-color-scheme: dark) { button { background: #2a2a2a; border-color: rgba(255, 255, 255, 0.3); } }
    button:hover { border-color: currentColor; }
    button:focus-visible { outline: 2px solid currentColor; outline-offset: 2px; }
    button.danger { border-color: #b3261e; color: #b3261e; }
    @media (prefers-color-scheme: dark) { button.danger { color: #f2b8b5; border-color: #f2b8b5; } }
    #status { min-height: 1.5em; margin: 0 0 16px; font-weight: 500; }
    #status.error { color: #b3261e; }
    @media (prefers-color-scheme: dark) { #status.error { color: #f2b8b5; } }
    a { color: inherit; }
  </style>
</head>
<body>
  <main>
    <h1 data-i18n="optionsTitle">Options de Carbomètre</h1>
    <p class="intro" data-i18n="optionsIntro"></p>
    <p id="status" role="status" aria-live="polite"></p>

    <fieldset>
      <legend data-i18n="optionsLanguageLegend">Langue de l'interface</legend>
      <label class="choice"><input type="radio" name="language" value="auto"><span data-i18n="optionsLanguageAuto"></span></label>
      <label class="choice"><input type="radio" name="language" value="fr"><span data-i18n="optionsLanguageFr"></span></label>
      <label class="choice"><input type="radio" name="language" value="en"><span data-i18n="optionsLanguageEn"></span></label>
      <p class="note" data-i18n="optionsLanguageNote"></p>
    </fieldset>

    <fieldset>
      <legend data-i18n="optionsLocationLegend">Localisation</legend>
      <label class="choice"><input type="radio" name="userLocation" value="fr"><span data-i18n="locationOptionFr"></span></label>
      <label class="choice"><input type="radio" name="userLocation" value="other"><span data-i18n="locationOptionOther"></span></label>
      <p class="note" data-i18n="optionsLocationNote"></p>
    </fieldset>

    <fieldset>
      <legend data-i18n="optionsGridLegend">Référence électrique</legend>
      <label class="choice"><input type="radio" name="gridReference" value="datacenter"><span data-i18n="optionsGridDatacenter"></span></label>
      <label class="choice"><input type="radio" name="gridReference" value="french-mix"><span data-i18n="optionsGridFrench"></span></label>
      <p class="note" data-i18n="optionsGridNote"></p>
    </fieldset>

    <fieldset>
      <legend data-i18n="optionsCoefficientsLegend">Coefficients</legend>
      <p class="note" data-i18n="optionsCoefficientsNote"></p>
      <div class="table-wrap">
        <table>
          <thead><tr id="coefficients-head"></tr></thead>
          <tbody id="coefficients-body"></tbody>
        </table>
      </div>
      <div class="actions">
        <button type="button" id="save-coefficients" data-i18n="optionsSaveCoefficients"></button>
        <button type="button" id="restore-defaults" data-i18n="optionsRestoreDefaults"></button>
      </div>
    </fieldset>

    <fieldset>
      <legend data-i18n="optionsDataLegend">Données</legend>
      <p class="note" data-i18n="optionsExportNote"></p>
      <div class="actions">
        <button type="button" id="export-json" data-i18n="optionsExportJson"></button>
        <button type="button" id="export-conversations" data-i18n="optionsExportConversationsCsv"></button>
        <button type="button" id="export-daily" data-i18n="optionsExportDailyCsv"></button>
        <button type="button" id="erase-data" class="danger" data-i18n="optionsEraseData"></button>
      </div>
    </fieldset>

    <p><a id="methodology-link" href="methodology.html" data-i18n="optionsMethodologyLink"></a></p>
  </main>
  <script src="options.js"></script>
</body>
</html>
