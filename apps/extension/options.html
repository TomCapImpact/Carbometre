<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Carbomètre</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      padding: 32px 24px 64px;
      font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f7f7f5;
      color: #111111;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #1e1e1e; color: #f5f5f5; }
    }
    main { max-width: 560px; margin: 0 auto; }
    h1 { font-size: 24px; margin: 0 0 8px; }
    .intro, .note { color: #595959; }
    .intro { margin: 0 0 24px; }
    .note { margin: 8px 0 0; font-size: 13px; }
    @media (prefers-color-scheme: dark) { .intro, .note { color: #c7c7c7; } }
    fieldset {
      border: 1px solid rgba(0, 0, 0, 0.15);
      border-radius: 10px;
      padding: 16px 20px;
      margin: 0 0 20px;
    }
    @media (prefers-color-scheme: dark) { fieldset { border-color: rgba(255, 255, 255, 0.18); } }
    legend { font-weight: 600; padding: 0 6px; }
    label.choice { display: block; margin: 6px 0; cursor: pointer; }
    label.choice input { margin-right: 8px; }
    #status { min-height: 1.5em; margin: 0 0 16px; font-weight: 500; }
    a { color: inherit; }
  </style>
</head>
<body>
  <main>
    <h1 data-i18n="optionsTitle">Options de Carbomètre</h1>
    <p class="intro" data-i18n="optionsIntro"></p>
    <p id="status" role="status" aria-live="polite"></p>

    <fieldset>
      <legend data-i18n="optionsLanguageLegend">Langue de l'interface</legend>
      <label class="choice"><input type="radio" name="language" value="auto"><span data-i18n="optionsLanguageAuto"></span></label>
      <label class="choice"><input type="radio" name="language" value="fr"><span data-i18n="optionsLanguageFr"></span></label>
      <label class="choice"><input type="radio" name="language" value="en"><span data-i18n="optionsLanguageEn"></span></label>
      <p class="note" data-i18n="optionsLanguageNote"></p>
    </fieldset>

    <p><a id="methodology-link" href="methodology.html" data-i18n="optionsMethodologyLink"></a></p>
  </main>
  <script src="options.js"></script>
</body>
</html>
