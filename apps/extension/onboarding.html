<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Carbomètre</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      padding: 48px 24px;
      font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f7f7f5;
      color: #111111;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #1e1e1e; color: #f5f5f5; }
    }
    main { max-width: 560px; margin: 0 auto; }
    h1 { font-size: 24px; margin: 0 0 24px; }
    p { margin: 0 0 16px; }
    .question { font-weight: 600; }
    .choices { display: flex; flex-wrap: wrap; gap: 12px; margin: 0 0 20px; }
    .choices button {
      flex: 1 1 200px;
      padding: 14px 18px;
      font: inherit;
      font-weight: 600;
      border-radius: 10px;
      border: 1px solid rgba(0, 0, 0, 0.2);
      background: #ffffff;
      color: inherit;
      cursor: pointer;
    }
    @media (prefers-color-scheme: dark) {
      .choices button { background: #2a2a2a; border-color: rgba(255, 255, 255, 0.2); }
    }
    .choices button:hover { border-color: currentColor; }
    .choices button:focus-visible { outline: 2px solid currentColor; outline-offset: 2px; }
    .explanation { font-size: 14px; color: #595959; }
    @media (prefers-color-scheme: dark) { .explanation { color: #c7c7c7; } }
    [data-step="done"]:focus { outline: none; }
  </style>
</head>
<body>
  <main>
    <h1 data-i18n="onboardingTitle">Bienvenue dans Carbomètre</h1>

    <section data-step="question">
      <p class="question" data-i18n="onboardingQuestion">Pour affiner l'estimation de vos émissions, dites-nous où vous êtes principalement basé :</p>
      <div class="choices">
        <button type="button" data-location="fr" data-i18n="locationOptionFr">Principalement en France</button>
        <button type="button" data-location="other" data-i18n="locationOptionOther">Principalement hors de France</button>
      </div>
      <p class="explanation" data-i18n="onboardingExplanation"></p>
    </section>

    <section data-step="done" hidden tabindex="-1" aria-live="polite">
      <p data-i18n="onboardingDone"></p>
    </section>
  </main>
  <script src="onboarding.js"></script>
</body>
</html>
